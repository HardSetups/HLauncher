# Her push/PR'da lint + test + build; v* tag'lerinde Windows kurulum paketi
# üretip GitHub Release taslağına yükler (otomatik güncellemenin kaynağı).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # PR'larda kurulabilir önizleme paketi üretir: gözden geçiren kişi kodu
  # çekmeden Actions artifact'inden exe'yi indirip deneyebilir.
  preview:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build preview installer
        run: npm run build && npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: HLauncher-PR-onizleme
          path: release/*.exe
          retention-days: 7

  # v* tag'lerinde paketin derlendiğini doğrular ve artifact olarak saklar.
  # Yayın CI'dan YAPILMAZ: sürüm iki repoya (HLauncher + HLauncher-releases)
  # yüklendiği için GITHUB_TOKEN yetmez; yayın `npm run release -- --publish`
  # ile yerelden yapılır (docs/GELISTIRME.md §4).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer (no publish)
        run: npm run build && npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: HLauncher-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          retention-days: 30
